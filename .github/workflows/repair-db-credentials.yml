name: Repair production DB credentials

# Manual fix for MySQL "Access denied" (errno 1045) between the backend and
# the docker-compose MySQL on the production host: the DB_PASSWORD in
# panacea/prod no longer matches the password MySQL was initialized with.
# Runs scripts/ec2-repair-db.sh on the host over SSM. It never deletes data
# and never prints a password; see the script's header for exactly what it
# changes. Type "repair" to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "repair" to align MySQL with the DB_PASSWORD in panacea/prod'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  repair:
    name: Repair DB credentials on the production host
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.confirm == 'repair' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
      HEALTH_PORT: ${{ vars.BACKEND_HEALTH_PORT || '5000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run repair on the host
        run: |
          python3 - > ssm-params.json <<'PY'
          import base64, json, os, shlex
          script = base64.b64encode(open("scripts/ec2-repair-db.sh", "rb").read()).decode()
          print(json.dumps({
              "commands": [
                  f"echo {script} | base64 -d > /tmp/ourogen-repair-db.sh",
                  f"HEALTH_PORT={shlex.quote(os.environ['HEALTH_PORT'])} bash /tmp/ourogen-repair-db.sh",
              ],
              "executionTimeout": ["600"],
          }))
          PY
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" --parameters file://ssm-params.json \
            --region "$AWS_REGION" --query "Command.CommandId" --output text)
          echo "SSM Command ID: $COMMAND_ID"
          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          INVOCATION=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --output json)
          echo "::group::Host output"; echo "$INVOCATION" | python3 -c 'import sys,json;print(json.load(sys.stdin)["StandardOutputContent"])'; echo "::endgroup::"
          echo "::group::Host errors"; echo "$INVOCATION" | python3 -c 'import sys,json;print(json.load(sys.stdin)["StandardErrorContent"])'; echo "::endgroup::"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Repair finished with status $STATUS. The host output above says which step stopped and why."
            exit 1
          fi
      - name: Verify sign-in from the internet
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.ourogen.ai/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"release-smoke@example.invalid","password":"not-a-real-password"}')
            echo "unknown-user login -> HTTP $code (401 means sign-in works)"
            [ "$code" = 401 ] && exit 0
            sleep 10
          done
          exit 1
