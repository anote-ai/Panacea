name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production, staging]

permissions:
  id-token: write   # required for OIDC
  contents: read    # required to check out the repo

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_TAG: "production"
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }} 
  S3_BUCKET: ${{ vars.S3_BUCKET_FRONTEND_PROD }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  APP_DIR: ${{ vars.APP_DIR }}  # <-- path to docker-compose.yml on EC2

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}  # <-- your role ARN
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image
        id: image
        working-directory: packages/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy-to-ec2:
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}  # <-- your role ARN
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM Session Manager
        env:
          IMAGE_URI: ${{ needs.build-and-push-backend.outputs.image_uri }}
          ECR_REGISTRY: ${{ needs.build-and-push-backend.outputs.ecr_registry }}
          AWS_REGION: ${{ env.AWS_REGION }}
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}             # <-- your EC2 instance ID
          APP_DIR: ${{ env.APP_DIR }}                   # <-- path to docker-compose.yml on EC2
        run: |
          set -euo pipefail

          if [ -z "$IMAGE_URI" ]; then
            echo "ERROR: IMAGE_URI is empty — the build-and-push-backend job did not produce an output."
            echo "Check the Quality Gate and build-and-push-backend job logs above."
            exit 1
          fi

          if [ -z "$ECR_REGISTRY" ]; then
            echo "ERROR: ECR_REGISTRY is empty — the build-and-push-backend job did not produce an output."
            exit 1
          fi

          if [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: INSTANCE_ID is empty — check that the INSTANCE_ID secret is set."
            exit 1
          fi

          echo "Deploying image: $IMAGE_URI"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::12} via GitHub Actions" \
            --parameters commands="[
              'set -e',
              'cd $APP_DIR',
              'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY',
              'docker pull $IMAGE_URI',
              'docker compose down',
              'docker compose up -d',
              'docker system prune -af'
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Remote deploy status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,ResponseCode:ResponseCode,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
              --output json
            exit 1
          fi

  deploy-frontend:
    name: Deploy Frontend to S3/CloudFront
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --workspace=packages/web
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}  # <-- your role ARN
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET_FRONTEND }}
        run: |
          aws s3 sync packages/web/dist/ s3://$S3_BUCKET --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp packages/web/dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 sync packages/web/dist/ s3://$S3_BUCKET \
            --exclude "*" --include "*.json" --cache-control "no-cache"
      - name: Invalidate CloudFront
        env:
          CF_DISTRIBUTION: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION --paths "/*"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [deploy-to-ec2, deploy-frontend]
    if: failure()
    steps:
      - uses: slackapi/slack-github-action@v1
        continue-on-error: true
        with:
          payload: |
            {"text": "Deploy FAILED on `${{ github.ref_name }}` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
