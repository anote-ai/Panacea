name: Release

# Triggered by pushing a tag like v1.2.3. Publishes the CLI, TypeScript SDK
# to npm, the Python SDK to PyPI, builds the mobile app via EAS, publishes
# the VS Code extension to the Marketplace, and the desktop app to GitHub
# Releases.
on:
  push:
    tags:
      - "v*"

jobs:
  publish-cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          registry-url: "https://registry.npmjs.org"
      - working-directory: packages/cli
        run: npm install
      - working-directory: packages/cli
        run: npm run build
      - working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk-ts:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          registry-url: "https://registry.npmjs.org"
      - working-directory: packages/sdk
        run: npm install
      - working-directory: packages/sdk
        run: npm run build
      - working-directory: packages/sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-sdk-py:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: packages/sdk-py
        run: pip install build
      - working-directory: packages/sdk-py
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-py/dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-mobile:
    name: Build mobile app (EAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - working-directory: packages/mobile
        run: npm install
      - run: npm install -g eas-cli
      # `eas submit` needs Apple/Google credentials wired into
      # packages/mobile/eas.json (currently an empty submit.production
      # stub) — see DEPLOYMENT.md. Until that's filled in, this only
      # builds the binaries; add `--auto-submit` once submit is configured.
      - working-directory: packages/mobile
        run: eas build --platform all --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  publish-vscode:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - working-directory: packages/vscode
        run: npm install
      - run: npm install -g @vscode/vsce
      - working-directory: packages/vscode
        run: vsce publish -p ${{ secrets.VSCE_PAT }}

  publish-desktop:
    name: Build and publish desktop app
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build bundled Python backend (PyInstaller)
        working-directory: packages/desktop
        run: |
          pip install -r ../backend/requirements.txt pyinstaller
          pyinstaller app.spec
          mkdir -p backend-dist
          cp -r dist/* backend-dist/
      - working-directory: packages/desktop/frontend
        run: npm install && npm run build
      - working-directory: packages/desktop
        run: npm install
      - working-directory: packages/desktop
        run: npx electron-forge publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
