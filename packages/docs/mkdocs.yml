site_name: Anote
site_url: https://docs.anote.ai
site_description: Unified AI coding assistant and chatbot platform
site_author: Anote AI

repo_name: anote-ai/Panacea
repo_url: https://github.com/anote-ai/Panacea

extra:
  homepage: https://anote.ai
  alternate:
    - name: English
      link: /
      lang: en
  # Display-only language list for the header dropdown (overrides/partials/header.html).
  # Kept separate from `alternate` above: mkdocs-material auto-emits
  # <link rel="alternate" hreflang="..."> SEO tags from `alternate` on every page, so
  # adding fake languages there would tell search engines this content has real
  # French/German/etc. translations when it doesn't. Every entry below links to "/"
  # (English) until real translated content ships.
  language_menu:
    - name: English
      link: /
      lang: en
    - name: Français
      link: /
      lang: fr
    - name: Deutsch
      link: /
      lang: de
    - name: Italiano
      link: /
      lang: it
    - name: 日本語
      link: /
      lang: ja
    - name: Español
      link: /
      lang: es
    - name: 한국어
      link: /
      lang: ko
    - name: 简体中文
      link: /
      lang: zh-Hans
    - name: 繁體中文
      link: /
      lang: zh-Hant
    - name: Русский
      link: /
      lang: ru
    - name: Bahasa Indonesia
      link: /
      lang: id
    - name: Português (BR)
      link: /
      lang: pt-BR

theme:
  name: material
  custom_dir: overrides
  font: false
  # A single (non-list) palette entry — Material only renders the light/dark
  # toggle button when `palette` is a list of multiple schemes. Every
  # reference screenshot from code.claude.com/docs shows one fixed light
  # theme with no toggle, so this matches that intentionally.
  palette:
    scheme: default
    primary: black
    accent: light blue
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/rocketlogo.png
  favicon: assets/favicon-removebg-preview.png

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - CLI:
    - Overview: cli/overview.md
    - Commands: cli/commands.md
    - Configuration: cli/config.md
  - VS Code Extension:
    - Overview: vscode/overview.md
    - Features: vscode/features.md
    - Settings: vscode/settings.md
  - Web App:
    - Overview: web/overview.md
    - Features: web/features.md
  - Desktop App:
    - Overview: desktop/overview.md
    - Installation: desktop/installation.md
    - Local Models: desktop/local-models.md
  - Mobile App:
    - Overview: mobile/overview.md
  - SDK:
    - TypeScript SDK: sdk/typescript.md
    - Python SDK: sdk/python.md
  - Backend API:
    - Overview: api/overview.md
    - Authentication: api/auth.md
    - Chat: api/chat.md
    - Documents: api/documents.md
    - Search: api/search.md
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md
