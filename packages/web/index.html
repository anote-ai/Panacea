<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ourogen-icon-black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#212121" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved/system theme before first paint so dark-mode users
      // never see a white flash. Mirrors the themeMode logic in src/App.tsx.
      (function () {
        var mode;
        try {
          mode = localStorage.getItem("themeMode") || localStorage.getItem("theme");
        } catch (e) {}
        var dark = mode === "dark" ||
          ((mode !== "light") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <title>Ourogen | Chat</title>
    <meta
      name="description"
      content="Ourogen is your AI assistant: chat, upload and ask questions about your documents, and get help with anything — sign in at chat.ourogen.ai."
    />
  </head>
  <body class="bg-white text-gray-900 dark:bg-[#212121] dark:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
